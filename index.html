<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBU Data Science Learning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@600;800&family=Noto+Sans+Telugu:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04121a;--t:#f6ecd2;--m:#c4b48c;--g:rgba(38,24,11,.66);--b:rgba(226,176,76,.32);--a:#e0a526;--a2:#2aa6a0;--a3:#b3261e;--code:#0c0905;--sky1:#02070f;--sky2:#0a2232;--sky3:#17505a;--moon:#f7efc9;--sea1:#0d4350;--sea2:#03131b;--w1:#115766;--w2:#0b4252;--w3:#062b37;--ship:#02070b;--cloud:rgba(150,190,205,.13);--hero1:rgba(66,42,16,.82);--hero2:rgba(10,44,52,.7)}
[data-theme=light]{--bg:#eddcae;--t:#2b1a0a;--m:#6b5330;--g:rgba(255,247,222,.78);--b:rgba(110,70,20,.4);--a:#9b6a12;--a2:#1d6f6a;--a3:#8f1d14;--code:#2b1a0a;--sky1:#4a2f63;--sky2:#e0775a;--sky3:#f8c877;--moon:#fff1a8;--sea1:#c8693a;--sea2:#5a2e1a;--w1:#8d4a2a;--w2:#6e3a22;--w3:#4e2814;--ship:#1d0f06;--cloud:rgba(255,230,200,.35);--hero1:rgba(255,244,214,.86);--hero2:rgba(240,214,160,.78)}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-top:env(safe-area-inset-top)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}#root{position:relative;z-index:1}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.glass{background:var(--g);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.wrap{max-width:1240px;margin:0 auto;padding:20px 18px}
header{position:sticky;top:0;z-index:20;margin:10px 12px}.hd{display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{font-weight:800;letter-spacing:.04em;display:flex;gap:11px;align-items:center}.brand small{display:block;font-size:.62rem;color:var(--m);letter-spacing:.14em;font-weight:600;margin-top:2px}.brandLogo{width:46px;height:46px;object-fit:contain;display:block;flex:0 0 46px}.brandName{display:flex;flex-direction:column;line-height:1.08}.brandName strong{font-size:.98rem;letter-spacing:.03em}.brandName small{font-size:.58rem;letter-spacing:.13em;font-weight:700}.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:.8rem}
nav{display:flex;gap:4px;margin-left:auto}nav a{padding:8px 14px;border-radius:10px;font-weight:600;font-size:.85rem;color:var(--m);transition:.2s}nav a:hover,nav a.on{background:var(--g);color:var(--t)}
.ic{background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:.95rem}.burger{display:none}
.hs{width:220px}
h1{font-size:clamp(1.8rem,4.5vw,3rem);margin:.2em 0;line-height:1.1}h2{margin:1.2em 0 .5em}h3{margin:.2em 0}
.grad{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--m)}.tag{display:inline-block;font-size:.68rem;letter-spacing:.1em;font-weight:700;color:var(--a2);text-transform:uppercase}
.btn{background:linear-gradient(135deg,var(--a),#7c5cff);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;display:inline-block;font-size:.9rem}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn.ghost{background:var(--g);border:1px solid var(--b);color:var(--t)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hero{padding:34px 28px;margin-bottom:22px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.dash{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.stu{padding:22px;position:sticky;top:90px}.av{width:132px;height:132px;overflow:hidden;border:3px solid var(--b);border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-size:2rem;font-weight:800;color:#fff;margin:0 auto 12px}
.av img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}.outimg{max-width:100%;border-radius:12px;margin-top:10px;background:#fff}dl{margin:10px 0}dt{font-size:.65rem;letter-spacing:.12em;color:var(--m);text-transform:uppercase;margin-top:10px}dd{margin:2px 0;font-weight:600;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}.stat{padding:16px}.stat b{font-size:2rem;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{padding:20px;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s;animation:up .4s both}.card:hover{transform:translateY(-4px);border-color:var(--a)}.card p{margin:0;color:var(--m);font-size:.9rem}
.pill{font-size:.7rem;padding:3px 9px;border-radius:99px;border:1px solid var(--b);color:var(--m);margin:2px 4px 2px 0;display:inline-block}
@keyframes up{from{opacity:0;transform:translateY(12px)}}.page{animation:up .3s both}
.sw{position:relative}.sw input,input,select,textarea{width:100%;background:var(--g);border:1px solid var(--b);color:var(--t);border-radius:12px;padding:12px 14px;font:inherit}.sw.big input{padding:16px 18px;font-size:1.05rem}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;padding:6px;background:var(--bg);animation:up .15s both}.dd a{display:block;padding:9px 12px;border-radius:10px}.dd a:hover,.dd a.on{background:var(--g)}.dd small{color:var(--a2);font-size:.62rem;letter-spacing:.12em;font-weight:700}
.crumbs{font-size:.8rem;color:var(--m);margin-bottom:12px}.crumbs a:hover{color:var(--a2)}
.code{background:var(--code);color:#e6edf7;border-radius:14px;overflow:auto;max-height:420px;font:13px/1.6 ui-monospace,Consolas,monospace;padding:14px 16px;white-space:pre;margin:0;border:1px solid var(--b)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;gap:8px;flex-wrap:wrap}
.arch{display:flex;flex-direction:column;align-items:center;gap:0;padding:20px}.node{padding:10px 20px;border-radius:12px;border:1px solid var(--a);background:var(--g);font-weight:700;font-size:.85rem;animation:up .4s both;cursor:default}.node:hover{background:var(--a);color:#fff}.ln{width:2px;height:20px;background:linear-gradient(var(--a),var(--a2))}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:10px;border:1px solid var(--b);background:var(--g);cursor:pointer;color:var(--t);font:inherit;font-weight:600;font-size:.85rem}.chip.on{background:var(--a);color:#fff}
.letter{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.2rem}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:14px;animation:up .2s both}.mb{width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;background:var(--bg)}.mb label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--m);margin:12px 0 4px}
.out{padding:14px;border-radius:12px;border:1px dashed var(--b);min-height:60px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.85rem}.err{color:#ff7a8a}
.pdf{aspect-ratio:3/4;max-height:70vh;width:100%;display:grid;place-items:center;text-align:center;padding:20px;border-radius:14px;border:1px dashed var(--b);overflow:auto}
footer{margin:30px 12px 12px;padding:24px;text-align:center}footer nav{justify-content:center;margin:10px 0}
@media(min-width:901px) and (max-width:1250px){nav a{padding:8px 7px;font-size:.72rem}.hd{gap:8px}.brandName strong{font-size:.82rem}.brandLogo{width:38px;height:38px;flex-basis:38px}}\n@media(max-width:900px){.dash{grid-template-columns:1fr}.stu{position:static}.hs{display:none}.burger{display:block;margin-left:auto}nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);border-radius:14px;padding:8px;border:1px solid var(--b)}nav.open{display:flex}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== PIRATE THEME ===== */
::selection{background:var(--a);color:#2a1604}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:linear-gradient(#e0a526,#8a5a12);border-radius:10px;border:2px solid #1b1207}::-webkit-scrollbar-track{background:#1b1207}
h1,h2,h3,.stat b,.ctext{font-family:'Pirata One','Cinzel',Georgia,serif;font-weight:400;letter-spacing:.02em}
h1{font-size:clamp(2.3rem,5.4vw,4rem);line-height:1.05}
h2{font-size:1.9rem;margin:1.3em 0 .6em}
h2::before{content:"\2693\00a0";color:var(--a);font-size:.8em}
h3{font-size:1.35rem}
.tag{font-family:'Cinzel',Georgia,serif;font-weight:800;letter-spacing:.14em;color:var(--a);background:rgba(224,165,38,.1);border:1px solid rgba(224,165,38,.4);padding:4px 12px;border-radius:6px}
.grad{background-image:linear-gradient(90deg,#ffe08a,#f2a33a,#fff1c1,#ffe08a);background-size:250% 100%;animation:flow 7s linear infinite}
[data-theme=light] .grad{background-image:linear-gradient(90deg,#7a1f12,#b8561a,#7a1f12,#b8561a)}
@keyframes flow{to{background-position:250% 0}}
/* background scene */
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg::before{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.42));pointer-events:none}
#bg::after{content:"";position:absolute;inset:0;z-index:3;background:#cfe6ff;opacity:0;animation:flash 16s infinite;pointer-events:none}
[data-theme=light] #bg::after{display:none}
@keyframes flash{0%,93%{opacity:0}93.6%{opacity:.14}96%,100%{opacity:0}}
.star{animation:twinkle 4s ease-in-out infinite}@keyframes twinkle{50%{opacity:.25}}
[data-theme=light] .stars{display:none}
.cloud{animation:drift 90s linear infinite}.c2{animation-duration:130s;animation-delay:-40s}.c3{animation-duration:110s;animation-delay:-70s}
@keyframes drift{from{transform:translateX(-500px)}to{transform:translateX(1700px)}}
.ship{animation:bob 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-9px) rotate(1.2deg)}}
.wv{animation:wave 20s linear infinite}.wv2{animation-duration:15s;animation-direction:reverse}.wv3{animation-duration:11s}
@keyframes wave{to{transform:translateX(-1440px)}}
.fog{fill:#cfe3ea;opacity:.1;filter:blur(26px);animation:fogm 40s ease-in-out infinite alternate}.f2{animation-duration:55s;animation-direction:alternate-reverse}
@keyframes fogm{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
/* glass -> leather/parchment */
.glass{border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,160,.14)}
[data-theme=light] .glass{box-shadow:0 8px 24px rgba(90,50,10,.28)}
/* header = wooden plank */
header,footer{--t:#f6ecd2;--m:#cdbb8e;--g:rgba(255,235,190,.1);--b:rgba(226,176,76,.38);color:var(--t)}
header .hd{border-radius:14px;border:2px solid #b8862d;background:repeating-linear-gradient(180deg,rgba(255,220,150,.05) 0 2px,transparent 2px 9px),linear-gradient(180deg,#5a3818,#2c1a0a);box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,150,.3)}
nav a{border-radius:8px;font-family:'Cinzel',Georgia,serif;font-weight:800;letter-spacing:.06em}
nav a.on{background:rgba(224,165,38,.22);color:#ffe9a8;box-shadow:inset 0 0 0 1px rgba(224,165,38,.6)}
.logo{background:linear-gradient(135deg,#f2c14e,#b3261e);color:#fff;border-radius:50%;box-shadow:0 0 0 2px #2c1a0a,0 0 0 4px #e0a526}
.ic{border-radius:8px}.ic:hover{background:#e0a526;color:#2a1604}
/* buttons */
.btn{background:linear-gradient(180deg,#f6cf62,#cf8a1a);color:#2a1604;border-radius:8px;font-family:'Cinzel',Georgia,serif;font-weight:800;letter-spacing:.04em;padding:11px 20px;box-shadow:0 5px 0 #7a4b0b,0 10px 18px rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #7a4b0b,0 14px 22px rgba(0,0,0,.45)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4b0b}
.btn.ghost{background:var(--g);color:var(--t);box-shadow:none;border:1px solid var(--b)}.btn.ghost:hover{border-color:var(--a);box-shadow:0 0 0 3px rgba(224,165,38,.2);transform:translateY(-1px)}
.chip{border-radius:8px}.chip.on{background:var(--a);color:#2a1604;border-color:var(--a)}
/* hero */
.hero{position:relative;overflow:hidden;padding:48px 40px;border-radius:16px;border:3px double rgba(224,165,38,.7);background:linear-gradient(135deg,var(--hero1),var(--hero2))}
.hero::after{content:"";position:absolute;right:-30px;bottom:-34px;width:260px;height:260px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cg%20stroke%3D%27%23f6e3a8%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M12%2070L88%2096%27/%3E%3Cpath%20d%3D%27M88%2070L12%2096%27/%3E%3C/g%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2738%27%20r%3D%2727%27%20fill%3D%27%23f6e3a8%27/%3E%3Crect%20x%3D%2734%27%20y%3D%2756%27%20width%3D%2732%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%23f6e3a8%27/%3E%3Ccircle%20cx%3D%2739%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27%23000%27/%3E%3Ccircle%20cx%3D%2761%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27%23000%27/%3E%3Cpath%20d%3D%27M50%2048L45%2058H55Z%27%20fill%3D%27%23000%27/%3E%3Cpath%20d%3D%27M42%2066V76M50%2066V76M58%2066V76%27%20stroke%3D%27%23000%27%20stroke-width%3D%272.5%27/%3E%3C/svg%3E") center/contain no-repeat;opacity:.13;transform:rotate(-8deg)}
[data-theme=light] .hero::after{background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Cg%20stroke%3D%27%236b4513%27%20stroke-width%3D%278%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M12%2070L88%2096%27/%3E%3Cpath%20d%3D%27M88%2070L12%2096%27/%3E%3C/g%3E%3Ccircle%20cx%3D%2750%27%20cy%3D%2738%27%20r%3D%2727%27%20fill%3D%27%236b4513%27/%3E%3Crect%20x%3D%2734%27%20y%3D%2756%27%20width%3D%2732%27%20height%3D%2720%27%20rx%3D%276%27%20fill%3D%27%236b4513%27/%3E%3Ccircle%20cx%3D%2739%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27%23000%27/%3E%3Ccircle%20cx%3D%2761%27%20cy%3D%2740%27%20r%3D%277%27%20fill%3D%27%23000%27/%3E%3Cpath%20d%3D%27M50%2048L45%2058H55Z%27%20fill%3D%27%23000%27/%3E%3Cpath%20d%3D%27M42%2066V76M50%2066V76M58%2066V76%27%20stroke%3D%27%23000%27%20stroke-width%3D%272.5%27/%3E%3C/svg%3E");opacity:.16}
.hero>*{position:relative;z-index:1}.hero .muted{max-width:62ch;font-size:1.02rem;line-height:1.65}
/* dashboard: profile on the RIGHT */
.dash{grid-template-columns:minmax(0,1fr) 320px}
.dash>.stu{order:2}
.glass.stu{--t:#2b1a0a;--m:#6b5330;--g:rgba(255,248,225,.5);--b:rgba(90,55,15,.45);color:var(--t);text-align:center;padding:0 22px 24px;border:3px double #6b4513;border-radius:10px;
 background:radial-gradient(ellipse at 30% 0,rgba(255,255,255,.3),transparent 60%),linear-gradient(160deg,#efdcA6,#d4b574);box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 0 40px rgba(110,70,20,.35)}
.stu::before{content:"\2605  STUDENT PROFILE  \2605";display:block;font-family:'Pirata One',Georgia,serif;font-size:1.5rem;letter-spacing:.12em;color:#7a1f12;padding:16px 0 10px;margin:0 -22px 18px;border-bottom:2px dashed rgba(90,50,10,.45)}
.av{border:4px solid #6b4513;box-shadow:0 0 0 3px #e0a526,0 12px 24px rgba(0,0,0,.45)}.av img{filter:sepia(.2) contrast(1.04)}
.stu dl{text-align:left;margin:14px 0}.stu dt{color:#8a2a1a;font-family:'Cinzel',Georgia,serif;font-weight:800}
.stu dd{padding-bottom:8px;border-bottom:1px dashed rgba(90,50,10,.4)}
.stu .tag{display:none!important}
.stu .btn.ghost{color:#2b1a0a;background:rgba(255,248,225,.55);border-color:rgba(90,50,10,.5)}
/* stats + cards */
.stat{position:relative;overflow:hidden;border-radius:12px;border-left:5px solid var(--a)}.stat b{font-size:2.8rem;line-height:1}
.card{position:relative;overflow:hidden;border-radius:12px}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#e0a526,#b3261e,#2aa6a0);opacity:.7}
.card:hover{border-color:var(--a);box-shadow:0 16px 38px rgba(0,0,0,.55),0 0 0 1px rgba(224,165,38,.5)}
.card h3{line-height:1.15}
.pill{background:rgba(224,165,38,.12);border-color:rgba(224,165,38,.4);color:var(--t);border-radius:6px}
.letter{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#b8861a);color:#2a1604;font-family:'Pirata One',Georgia,serif;box-shadow:0 0 0 2px #2c1a0a,0 0 0 4px #e0a526}
.node{border-color:var(--a);border-radius:8px}.node:hover{background:var(--a);color:#2a1604}
.ln{background:linear-gradient(var(--a),var(--a3))}
input,select,textarea{border-radius:8px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(224,165,38,.28)}
.code{border-left:4px solid var(--a);border-radius:10px}.out{border-color:rgba(224,165,38,.5)}
footer{border-radius:14px;border:2px solid #b8862d;background:linear-gradient(180deg,#4a2f14,#25160a)}
/* monkey holding the search icon */
.sw.big{margin-top:44px}
.sw input{padding-right:104px}.sw.big input{padding-right:108px}
.monkey{position:absolute;right:14px;top:-66px;width:92px;height:131px;padding:0;border:0;background:none;cursor:pointer;z-index:4;transform-origin:34% 0;animation:swing 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))}
.monkey svg{width:100%;height:100%;display:block}.monkey:hover{animation-duration:1.1s}.monkey:focus-visible{outline-offset:4px}
@keyframes swing{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
.ic.clr{position:absolute;right:98px;top:50%;transform:translateY(-50%);padding:5px 9px}
.hs .monkey{width:50px;height:71px;top:-14px;right:6px}.hs .ic.clr{right:62px}.hs input{padding-right:66px}
/* crab opens the page */
.crabov{position:fixed;inset:0;z-index:200;overflow:hidden;pointer-events:none}
.scroll{position:absolute;inset:0;pointer-events:auto;animation:crabSheet 2.4s both}
.init .scroll{animation:crabSheetI 1.9s both}

\", \"Jun\"]\nsales = [120, 150, 180, 160, 220, 250]\nexpenses = [80, 100, 120, 110, 140, 160]\nfig, ax = plt.subplots(2, 1, figsize=(10, 8))\nax[0].plot(months,sales,marker=\"o\",linewidth=2,label=\"Sales\")\nax[0].set_title(\"Monthly Sales\")\nax[0].set_xlabel(\"Month\")\nax[0].set_ylabel(\"Sales\")\nax[0].set_xticks(range(len(months)))\nax[0].set_xticklabels(months)\nax[0].annotate(\"Highest Sales\",xy=(5, 250),xytext=(3.5, 270),arrowprops=dict(arrowstyle=\"->\"))\nax[0].legend()\nax[0].grid(True)\n\nax[1].plot(months,expenses,marker=\"s\",linewidth=2,label=\"Expenses\")\nax[1].set_title(\"Monthly Expenses\")\nax[1].set_xlabel(\"Month\")\nax[1].set_ylabel(\"Expenses\")\nax[1].set_xticks(range(len(months)))\nax[1].set_xticklabels(months)\nax[1].annotate(\"Highest Expense\",xy=(5, 160),xytext=(3.5, 180),arrowprops=dict(arrowstyle=\"->\"))\nax[1].legend()\nax[1].grid(True)\n\nfig.suptitle(\"Monthly Sales and Expenses Analysis\", fontsize=16)\n\n# Adjust layout\nplt.tight_layout()\n\n# Save the plot to a file\nplt.savefig(\n    \"monthly_sales_expenses.png\",\n    dpi=300,\n    bbox_inches=\"tight\"\n)\n\n# Display the plot\nplt.show()", "output": "(no printed output)"}]}, {"id": 6, "number": "06", "title": "Time Series with Pandas", "description": "Create timestamps, date ranges, time zones, periods and hourly time series using Pandas.", "module": 3, "difficulty": "Beginner", "tools": ["Python", "Pandas"], "overview": {"summary": "This experiment covers: Creating a Time Series with Timestamps; Generating Date Ranges; Time Zone Localization; Period Arithmetic; Period Frequency Conversion; Time Series with a Timestamp Index; Hourly Time Series.", "architecture": ["Dataset", "Data Collection", "Preprocessing", "Analysis", "Visualization", "Output"]}, "subExperiments": [{"id": "A", "title": "Creating a Time Series with Timestamps", "aim": "To demonstrate: creating a time series with timestamps.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\ndates=pd.to_datetime([\n'2026-01-01',\n'2026-01-02',\n'2026-01-03',\n'2026-01-04',\n'2026-01-05'\n])\ntemperature=[28,30,29,31,32]\ntime_series=pd.Series(temperature,index=dates)\nprint(time_series)", "output": "2026-01-01    28\n2026-01-02    30\n2026-01-03    29\n2026-01-04    31\n2026-01-05    32\ndtype: int64"}, {"id": "B", "title": "Generating Date Ranges", "aim": "To demonstrate: generating date ranges.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\ndate_index=pd.date_range(start='2026-01-01',periods=7,freq='D')\nprint(date_index)", "output": "DatetimeIndex(['2026-01-01', '2026-01-02', '2026-01-03', '2026-01-04',\n               '2026-01-05', '2026-01-06', '2026-01-07'],\n              dtype='datetime64[us]', freq='D')"}, {"id": "C", "title": "Time Zone Localization", "aim": "To demonstrate: time zone localization.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\n# 1.Generate date range by setting a time zone\nindia_dates=pd.date_range(start='2026-01-01 09:00',periods=3,freq='h',tz='Asia/Kolkata')\nprint(\"1. Date Range with Asia/Kolkata Time Zone:\")\nprint(india_dates)\n# 2.Create a timezone-naive DatetimeIndex\ndates=pd.date_range(start='2026-01-01 09:00',periods=3,freq='h')\nprint(\"\\n2. Timezone-naive Date Range:\")\nprint(dates)\n# 3.Localize the timezone\nlocalized_dates=dates.tz_localize('Asia/Kolkata')\nprint(\"\\n3. After Localizing to Asia/Kolkata:\")\nprint(localized_dates)\n# 4.Convert to another timezone using tz_convert()\nnew_york_dates=localized_dates.tz_convert('America/New_York')\nprint(\"\\n4. Converted to America/New_York:\")\nprint(new_york_dates)\n# 5.Create another time series in a different timezone\nindia_series=pd.Series([100,200,300],index=localized_dates)\nnew_york_series=pd.Series([400,500,600],index=new_york_dates)\nprint(\"\\n5. India Time Series:\")\nprint(india_series)\nprint(\"\\nNew York Time Series:\")\nprint(new_york_series)\n# 6.Combine two different timezone series\ncombined_series=pd.concat([india_series,new_york_series])\nprint(\"\\n6. Combined Time Series:\")\nprint(combined_series)", "output": "1. Date Range with Asia/Kolkata Time Zone:\nDatetimeIndex(['2026-01-01 09:00:00+05:30', '2026-01-01 10:00:00+05:30',\n               '2026-01-01 11:00:00+05:30'],\n              dtype='datetime64[us, Asia/Kolkata]', freq='h')\n\n2. Timezone-naive Date Range:\nDatetimeIndex(['2026-01-01 09:00:00', '2026-01-01 10:00:00',\n               '2026-01-01 11:00:00'],\n              dtype='datetime64[us]', freq='h')\n\n3. After Localizing to Asia/Kolkata:\nDatetimeIndex(['2026-01-01 09:00:00+05:30', '2026-01-01 10:00:00+05:30',\n               '2026-01-01 11:00:00+05:30'],\n              dtype='datetime64[us, Asia/Kolkata]', freq=None)\n\n4. Converted to America/New_York:\nDatetimeIndex(['2025-12-31 22:30:00-05:00', '2025-12-31 23:30:00-05:00',\n               '2026-01-01 00:30:00-05:00'],\n              dtype='datetime64[us, America/New_York]', freq=None)\n\n5. India Time Series:\n2026-01-01 09:00:00+05:30    100\n2026-01-01 10:00:00+05:30    200\n2026-01-01 11:00:00+05:30    300\ndtype: int64\n\nNew York Time Series:\n2025-12-31 22:30:00-05:00    400\n2025-12-31 23:30:00-05:00    500\n2026-01-01 00:30:00-05:00    600\ndtype: int64\n\n6. Combined Time Series:\n2026-01-01 09:00:00+05:30    100\n2026-01-01 10:00:00+05:30    200\n2026-01-01 11:00:00+05:30    300\n2025-12-31 22:30:00-05:00    400\n2025-12-31 23:30:00-05:00    500\n2026-01-01 00:30:00-05:00    600\ndtype: int64"}, {"id": "D", "title": "Period Arithmetic", "aim": "To demonstrate: period arithmetic.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\np=pd.Period('2026-01',freq='M')\nprint(\"Original Period:\")\nprint(p)\nprint(\"\\nAfter adding 2:\")\nprint(p+2)\nprint(\"\\nAfter adding 5:\")\nprint(p+5)\nprint(\"\\nAfter subtracting 1:\")\nprint(p-1)\nprint(\"\\nAfter subtracting 3:\")\nprint(p-3)\nperiods=pd.period_range(start='2026-01',periods=6,freq='M')\nprint(\"\\nRange of Periods:\")\nprint(periods)", "output": "Original Period:\n2026-01\n\nAfter adding 2:\n2026-03\n\nAfter adding 5:\n2026-06\n\nAfter subtracting 1:\n2025-12\n\nAfter subtracting 3:\n2025-10\n\nRange of Periods:\nPeriodIndex(['2026-01', '2026-02', '2026-03', '2026-04', '2026-05', '2026-06'], dtype='period[M]')"}, {"id": "E", "title": "Period Frequency Conversion", "aim": "To demonstrate: period frequency conversion.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\n#1.Create a monthly Period\np=pd.Period('2026-01',freq='M')\nprint(\"Original Period:\")\nprint(p)\n#2.Convert monthly Period to daily frequency\ndaily_start=p.asfreq('D',how='start')\nprint(\"\\nMonthly Period converted to Daily (Start):\")\nprint(daily_start)\ndaily_end=p.asfreq('D',how='end')\nprint(\"\\nMonthly Period converted to Daily (End):\")\nprint(daily_end)\n#3.Create a PeriodIndex\nperiod_index=pd.period_range(start='2026-01',periods=3,freq='M')\nprint(\"\\nOriginal PeriodIndex:\")\nprint(period_index)\n#4.Convert PeriodIndex to daily frequency\ndaily_period_index=period_index.asfreq('D',how='start')\nprint(\"\\nPeriodIndex converted to Daily Frequency:\")\nprint(daily_period_index)\n#5.Convert PeriodIndex to daily frequency at end\ndaily_period_index_end=period_index.asfreq('D',how='end')\nprint(\"\\nPeriodIndex converted to Daily Frequency (End):\")\np      Sales  Profit\n2026-01   1000     200\n2026-02   1500     300\n2026-03   1800     400\n2026-04   2200     500"}, {"id": "G", "title": "Hourly Time Series", "aim": "To demonstrate: hourly time series.", "procedure": ["Open a Python environment (Jupyter or Colab).", "Import the required libraries.", "Write and run the code below.", "Observe and record the output."], "code": "import pandas as pd\n#1.Create an hourly time series\ndates=pd.date_range(start='2026-01-01 00:00',periods=12,freq='h')\nvalues=[10,12,15,14,18,20,22,21,25,28,30,32]\ntime_series=pd.Series(values,index=dates)\nprint(\"Original Hourly Time Series:\")\nprint(time_series)\n#2.Resampling-calculate 3-hourly mean\nresampled=time_series.resample('3h').mean()\nprint(\"\\nResampled Time Series - 3 Hour Mean:\")\nprint(resampled)\n#3.Downsampling-Hourly to 4-hourly\ndownsampled=time_series.resample('4h').sum()\nprint(\"\\nDownsampled Time Series - 4 Hour Sum:\")\nprint(downsampled)\n#4.Upsampling-Hourly to 30-minute intervals\nupsampled=time_series.resample('30min').asfreq()\nprint(\"\\nUpsampled Time Series - 30 Minute:\")\nprint(upsampled)\n#5.Upsampling with Forward Fill\nupsampled_ffill=time_series.resample('30min').ffill()\nprint(\"\\nUpsampled Time Series using Forward Fill:\")\nprint(upsampled_ffill)", "output": "Original Hourly Time Series:\n2026-01-01 00:00:00    10\n2026-01-01 01:00:00    12\n2026-01-01 02:00:00    15\n2026-01-01 03:00:00    14\n2026-01-01 04:00:00    18\n2026-01-01 05:00:00    20\n2026-01-01 06:00:00    22\n2026-01-01 07:00:00    21\n2026-01-01 08:00:00    25\n2026-01-01 09:00:00    28\n2026-01-01 10:00:00    30\n2026-01-01 11:00:00    32\nFreq: h, dtype: int64\n\nResampled Time Series - 3 Hour Mean:\n2026-01-01 00:00:00    12.333333\n2026-01-01 03:00:00    17.333333\n2026-01-01 06:00:00    22.666667\n2026-01-01 09:00:00    30.000000\nFreq: 3h, dtype: float64\n\nDownsampled Time Series - 4 Hour Sum:\n2026-01-01 00:00:00     51\n2026-01-01 04:00:00     81\n2026-01-01 08:00:00
